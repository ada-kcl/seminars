- title: "Cold-Start Active Learning under Low Annotation Budgets"
  speaker: "Jiayuan Huang"
  date: "2026-01-26"         # YYYY-MM-DD format required
  time: "15:00-16:00"        # Use hyphen for time range, spaces optional
  room: "(S)5.01"
  abstract: |
    Active learning aims to reduce annotation cost by selectively querying the most informative samples from an unlabeled pool. However, in the early stages of active learning, models are typically trained with extremely limited labeled data, leading to unreliable uncertainty estimates and unstable query strategies. As a result, uncertainty-based active learning methods often underperform random sampling during this phase. This issue, commonly referred to as the cold-start problem, significantly degrades the effectiveness of uncertainty-based sampling methods and hinders overall learning efficiency. In this talk, we will discuss approaches to addressing the cold-start problem. Specifically,

    - we will review a commonly used framework for mitigating the cold-start issue in active learning;
    - we will propose a conceptual perspective based on PAC/PAC-Bayes theory to identify the end of the cold-start regime, that is, to characterize when uncertainty-based methods begin to outperform random sampling.
  

- title: "A Stitch in Time: Learning Procedural Workflow via Self-Supervised Plackett–Luce Ranking"
  speaker: "Chengan Che"
  date: "2026-02-09"         # YYYY-MM-DD format required
  time: "15:00-16:00"        # Use hyphen for time range, spaces optional
  room: "(S)5.01"
  abstract: |
   Procedural activities, ranging from routine cooking to complex surgical operations, are highly structured as a set of actions conducted in a specific temporal order. Despite their success on static images and short clips, current self-supervised learning methods often overlook the procedural nature that underpins such activities. We expose the lack of procedural awareness in current SSL methods with a motivating experiment: models pretrained on forward and time-reversed sequences produce highly similar features, confirming that their representations are blind to the underlying procedural order. To address this shortcoming, we propose PL-Stitch, a self-supervised framework that harnesses the inherent temporal order of video frames as a powerful supervisory signal. Our approach integrates two novel probabilistic objectives based on the Plackett-Luce (PL) model. The primary PL objective trains the model to sort sampled frames chronologically, compelling it to learn the global workflow progression. The secondary objective, a spatio-temporal jigsaw loss, complements the learning by capturing fine-grained, cross-frame object correlations. Our approach consistently achieves superior performance across five surgical and cooking benchmarks. Specifically, PL-Stitch yields significant gains in surgical phase recognition (e.g., +11.4 pp k-NN accuracy on Cholec80) and cooking action segmentation (e.g., +5.7 pp linear probing accuracy on Breakfast), demonstrating its effectiveness for procedural video representation learning.

- title: "The Parameterized Complexity of Counting Small Sub-Hypergraphs"
  speaker: "Dr.Philip wellnitz"
  date: "2026-02-24"         # YYYY-MM-DD format required
  time: "15:00-16:00"        # Use hyphen for time range, spaces optional
  room: "(S)5.01"
  abstract: | 
   Subgraph counting is a fundamental problem whose computational complexity is well understood. Quite surprisingly, the hypergraph version of subgraph counting has been almost ignored. In this work, we address this gap by investigating the most basic sub-hypergraph counting problem: given two hypergraphs H and G, compute the number of sub-hypergraphs of G isomorphic to H. Formally, for a family C of hypergraphs, let \#Sub(C) be the restriction of the problem to H in C; the induced variant \#IndSub(C) is defined analogously. Our main contribution is a complete classification of the fixed-parameter tractability of these problems. Assuming the Exponential Time Hypothesis, we prove that \#Sub(C) is fixed-parameter tractable if and only if C has bounded fractional co-independent edge-cover number, a novel graph parameter introduced in this work, and that \#IndSub(C) is fixed-parameter tractable if and only if C has bounded fractional edge-cover number. Both results subsume preexisting results for graphs as special cases. We also show that the fixed-parameter tractable cases of \#Sub(C) and \#IndSub(C) are unlikely to be in polynomial time, unless respectively \#P=P and Graph Isomorphism is contained in P. This shows a separation with the special case of graphs, where the fixed-parameter tractable cases are known to actually be in polynomial time. Joint work with Marc Roth, Marco Bressan, Julian Brinkmann, and Holger Dell.

- title: "Learning from Demonstration for Sterile Surgical Manipulation: A Vision-Based Framework for Robotic Assistance in the Operating Room"
  speaker: "Eugenia Akpo"
  date: "2026-03-02"         # YYYY-MM-DD format required
  time: "16:00-17:00"        # Use hyphen for time range, spaces optional
  room: "(S)5.01"
  abstract: | 
   Robotic assistance in surgical environments has traditionally focused on tasks performed during the procedure itself, while preparatory activities such as opening sterile packaging, organizing instruments, and establishing sterile fields continue to be carried out manually by perioperative nurses. These repetitive, bimanual tasks contribute to musculoskeletal strain among healthcare workers and introduce variability that can influence patient safety. This presentation describes the PhD research, which develops a vision-based Learning from Demonstration (LfD) framework that enables robotic systems to acquire sterile manipulation skills through observation of human demonstrations. The work is organized into three stages: (1) Sensing, which establishes robust egocentric perception using RGB-D cameras to estimate three-dimensional hand kinematics during sterile package opening, supported by a spatio-temporal Graph Neural Network designed to improve anatomical plausibility of estimated poses; (2) Simulation, which converts refined human motion into physics-based MuJoCo environments that incorporate anthropomorphic Shadow Hand models for imitation learning and policy development; and (3) Sim-to-Real Transfer, which deploys the learned behaviours on physical robotic platforms while preserving sterility requirements. Key contributions include the release of an egocentric dataset capturing surgical preparation tasks performed by operating room nurses, pose refinement methods that reduce hand pose estimation error by 14.3 percent and improve the physical feasibility of robotic execution, and a validation framework that integrates geometric accuracy with physics-based execution metrics. This research aims to advance supervised autonomy in surgical preparation, reduce physical workload for clinical staff, and support greater consistency and safety in surgical procedures.

- title: "Using Bioconductor as a pipeline for biological analysis. How can Machine Learning be used for radiation dose prediction"
  speaker: "Modest-Constantin Lungociu"
  date: "2026-03-16"         # YYYY-MM-DD format required
  time: "15:00-16:00"        # Use hyphen for time range, spaces optional
  room: "(S)5.01"
  abstract: | 
   In this tutorial, I will walk through a complete RNA-seq differential gene expression workflow for analysing transcriptional responses to ionising radiation using the DESeq2 pipeline. We will explore how to preprocess count data, perform normalisation, run differential expression analysis, and interpret key visualisations such as PCA plots, MA plots, volcano plots, and heatmaps. The session will demonstrate these steps using several human tissue radiation datasets, illustrating how transcriptomic signals can be used to identify biomarkers and prepare data for downstream machine learning applications in radiation biodosimetry. 

- title: "Seeing Beyond the Visible: A modal Panoptic Segmentation for Complete Scene Understanding"
  speaker: "Xinyue Chen"
  date: "2026-03-23"         # YYYY-MM-DD format required
  time: "15:00-16:00"        # Use hyphen for time range, spaces optional
  room: "(S)5.01"
  abstract: | 
   A modal panoptic segmentation aims to partition an image into semantically meaningful regions while reasoning about both the visible and occluded parts of a scene. This task moves scene understanding closer to human perception, where people naturally infer the complete structure of objects and environments despite partial occlusions. In this talk, I will present an overview of a full pipeline for a modal panoptic segmentation and discuss how a system can infer regions that are not directly visible in the image. The talk will walk through the key stages of the pipeline and illustrate them with visualized examples, providing an intuitive understanding of how occluded regions can be predicted to achieve more complete scene interpretation.

- title: "Can LLM-Generated Text Empower Surgical Vision-Language Pre-training?"
  speaker: "Chao Wang"
  date: "2026-03-30"         # YYYY-MM-DD format required
  time: "15:00-16:00"        # Use hyphen for time range, spaces optional
  room: "(S)5.01"
  abstract: | 
   In recent years, self-supervised learning has significantly advanced surgical vision models, enabling strong spatiotemporal understanding from video data. However, extending these models to multi-modal reasoning remains challenging due to the high cost and limited availability of expert-annotated surgical text. In this talk, I will introduce SurgLIME, a scalable vision-language pre-training framework that leverages LLM-generated narratives to overcome this bottleneck. We first construct LIME, a large-scale multi-modal dataset derived from open-access surgical videos paired with automatically generated textual descriptions. While this approach dramatically improves scalability, it also introduces noisy and potentially unreliable text. To address this issue, SurgLIME incorporates a parameter-efficient dual-encoder architecture with LoRA adaptation, along with a confidence-aware training mechanism that down-weights uncertain textual signals during contrastive learning. Our experiments on AutoLaparo and Cholec80 demonstrate that SurgLIME achieves strong zero-shot cross-modal alignment while preserving the robustness of pre-trained visual representations. This work highlights the potential of LLM-generated text as a scalable alternative to expert annotations in surgical vision-language learning, while also addressing the challenges of noise and reliability. 
 
- title: "Unveiling tumour heterogeneity in non-small cell lung cancer via pathway-centric multi-omics analyses"
  speaker: "Sabaoon Zeb"
  date: "2026-04-13"         # YYYY-MM-DD format required
  time: "15:00-16:00"        # Use hyphen for time range, spaces optional
  room: "(S)5.01"
  abstract: | 
   Non-small cell lung cancer (NSCLC) is a biologically heterogeneous disease encompassing adenocarcinoma, squamous cell carcinoma, and large cell carcinoma. Patients with similar clinical stage and histology often experience distinct outcomes and therapy responses, reflecting functional heterogeneity, particularly intra-tumour variation, that is not captured by conventional classification. We present a pathway-centric deep learning framework for multi-omics integration to infer biologically meaningful functional representations across tumour regions. This approach will capture inter- and intra-tumour heterogeneity, revealing molecular variation that may be overlooked in single-sample analyses. Derived pathway profiles will support the characterisation of tumour states and downstream modelling of clinically relevant molecular states. While explainable machine learning will further identify pathways associated with these functional patterns and their potential prognostic relevance. This framework will provide a reproducible pipeline for pathway-based multi-omics analysis, improve understanding of tumour biology, enable heterogeneity-aware prognostic modelling, and facilitate translational applications for personalised patient management.

- title: "The Computational Intractability of Not Worst Responding"
  speaker: "Dr Edwin Lock"
  date: "2026-04-27"
  time: "15:00-16:00"
  room: "(S)5.01"
  paper_url: "https://arxiv.org/abs/2602.10966"
  person_url: "https://edwinlock.com"
  abstract: |
    Finding, counting, or determining the existence of Nash equilibria, where players must play optimally given each others' actions, are known to be computationally intractable problems. We ask whether weakening optimality to the requirement that each player merely avoid worst responses—arguably the weakest meaningful rationality criterion—yields tractable solution concepts. We show that it does not: any solution concept with this minimal guarantee is "as intractable" as pure Nash equilibrium. In general games, determining the existence of *no-worst-response* action profiles is NP-complete, finding one is NP-hard, and counting them is #P-complete. In potential games, where existence is guaranteed, the search problem is PLS-complete. Computational intractability therefore stems not only from the requirement of optimality, but also from the requirement of a minimal rationality guarantee *for each player*. Moreover, relaxing the latter requirement gives rise to a tractability trade-off between the strength of individual rationality guarantees and the fraction of players satisfying them.

- title: " Faster Algorithms for Shortest Unique or Absent Substrings"
  speaker: "Hilde Verbeek"
  date: "2026-05-11"
  time: "15:00-16:00"
  room: "BH (S)5.01"
  paper_url: "https://arxiv.org/abs/2605.04826"
  person_url: "https://hildeverbeek.nl"
  abstract: |
    The shortest unique substring problem (SUS) asks, given a string of length $n$, for the shortest substring that occurs exactly once in it. Similarly, the shortest absent substring (SAS) asks for a string that does not occur at all. Both problems admit folklore linear-time algorithms using the suffix tree. However, in the word RAM model, strings on small alphabets (of size $\sigma$) can be stored in $O(n \log \sigma / \log n)$ space, and thus sublinear-time algorithms are possible for certain problems. We present algorithms for SUS and SAS that run in $O(n \log \sigma / \sqrt{\log n})$ time, in which we decompose the problem based on the length and period of the substring to be found. We explore various algorithmic techniques such as heavy-light decompositions, skyline problems, Lyndon representations and wavelet trees to arrive at our solution. Finally, we solve the SAS problem in the same running time by efficiently constructing a de Bruijn sequence (a string that contains all words of a certain length $k$) and applying a modified version of the SUS algorithm to it.
